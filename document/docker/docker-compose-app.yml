version: '3'
services:
  mall-admin:
    image: mall/mall-admin:1.0-SNAPSHOT
    container_name: mall-admin
    security_opt:
      - no-new-privileges:true #禁止容器内进程通过setuid/setgid程序提升权限
    read_only: true #容器根文件系统只读，防止运行时被写入或篡改
    tmpfs:
      - /tmp #Spring Boot/Tomcat临时目录需可写
    ports:
      - 8080:8080
    volumes:
      - /mydata/app/mall-admin/logs:/var/logs
      - /etc/localtime:/etc/localtime
    environment:
      - 'TZ="Asia/Shanghai"'
      #JWT签名密钥，需在部署环境中提供随机生成的强密钥，未设置时容器启动失败
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set to a randomly generated secret}
    external_links:
      - mysql:db #可以用db这个域名访问mysql服务
  mall-search:
    image: mall/mall-search:1.0-SNAPSHOT
    container_name: mall-search
    security_opt:
      - no-new-privileges:true #禁止容器内进程通过setuid/setgid程序提升权限
    read_only: true #容器根文件系统只读，防止运行时被写入或篡改
    tmpfs:
      - /tmp #Spring Boot/Tomcat临时目录需可写
    ports:
      - 8081:8081
    volumes:
      - /mydata/app/mall-search/logs:/var/logs
      - /etc/localtime:/etc/localtime
    environment:
      - 'TZ="Asia/Shanghai"'
    external_links:
      - elasticsearch:es #可以用es这个域名访问elasticsearch服务
      - mysql:db #可以用db这个域名访问mysql服务
  mall-portal:
    image: mall/mall-portal:1.0-SNAPSHOT
    container_name: mall-portal
    security_opt:
      - no-new-privileges:true #禁止容器内进程通过setuid/setgid程序提升权限
    read_only: true #容器根文件系统只读，防止运行时被写入或篡改
    tmpfs:
      - /tmp #Spring Boot/Tomcat临时目录需可写
    ports:
      - 8085:8085
    volumes:
      - /mydata/app/mall-portal/logs:/var/logs
      - /etc/localtime:/etc/localtime
    environment:
      - 'TZ="Asia/Shanghai"'
      #JWT签名密钥，需在部署环境中提供随机生成的强密钥，未设置时容器启动失败
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set to a randomly generated secret}
      #支付宝密钥材料，只能由部署环境（或密钥管理系统）注入；未注入时为空，支付回调验签直接拒绝
      - ALIPAY_PUBLIC_KEY=${ALIPAY_PUBLIC_KEY:-}
      - ALIPAY_APP_PRIVATE_KEY=${ALIPAY_APP_PRIVATE_KEY:-}
    external_links:
      - redis:redis #可以用redis这个域名访问redis服务
      - mongo:mongo #可以用mongo这个域名访问mongo服务
      - mysql:db #可以用db这个域名访问mysql服务
      - rabbitmq:rabbit #可以用rabbit这个域名访问rabbitmq服务