version: '3'
services:
  mysql:
    image: mysql:5.7
    container_name: mysql
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always
    read_only: true #根文件系统只读，数据、配置、日志目录已单独挂载
    tmpfs:
      - /tmp #排序、临时表等临时文件目录
      - /var/run/mysqld #socket与pid文件目录
    security_opt:
      - no-new-privileges:true #禁止容器内进程通过setuid/setgid程序提升权限（入口脚本降权不受影响）
    environment:
      MYSQL_ROOT_PASSWORD: root #设置root帐号密码
    ports:
      - 3306:3306
    volumes:
      - /mydata/mysql/data:/var/lib/mysql #数据文件目录挂载
      - /mydata/mysql/conf:/etc/mysql #配置文件目录挂载
      - /mydata/mysql/log:/var/log/mysql #日志文件目录挂载
  redis:
    image: redis:7
    container_name: redis
    command: redis-server --appendonly yes
    read_only: true #根文件系统只读，数据目录已单独挂载
    tmpfs:
      - /tmp #临时文件目录
    security_opt:
      - no-new-privileges:true #禁止容器内进程通过setuid/setgid程序提升权限（入口脚本降权不受影响）
    volumes:
      - /mydata/redis/data:/data #数据文件目录挂载
    ports:
      - 6379:6379
  nginx:
    image: nginx:1.22
    container_name: nginx
    read_only: true #根文件系统只读，配置、静态资源、日志目录已单独挂载
    tmpfs:
      - /var/cache/nginx #请求与代理临时文件目录
      - /var/run #nginx.pid所在目录
    security_opt:
      - no-new-privileges:true #禁止容器内进程通过setuid/setgid程序提升权限（worker降权不受影响）
    volumes:
      - /mydata/nginx/conf:/etc/nginx #配置文件目录挂载
      - /mydata/nginx/html:/usr/share/nginx/html #静态资源根目录挂载
      - /mydata/nginx/logs:/var/log/nginx #日志文件目录挂载
    ports:
      - 80:80
  rabbitmq:
    image: rabbitmq:3.9.11-management
    container_name: rabbitmq
    read_only: true #根文件系统只读，配置、数据、日志目录已单独挂载
    tmpfs:
      - /tmp #Erlang运行时临时文件目录
    security_opt:
      - no-new-privileges:true #禁止容器内进程通过setuid/setgid程序提升权限（入口脚本降权不受影响）
    volumes:
      - /mydata/rabbitmq/conf:/etc/rabbitmq #配置文件目录挂载，入口脚本需在此生成配置（先执行document/sh/init-env-config.sh，从镜像中导出enabled_plugins与conf.d默认配置，management插件与默认配置不会被屏蔽）
      - /mydata/rabbitmq/data:/var/lib/rabbitmq #数据文件目录挂载
      - /mydata/rabbitmq/logs:/var/log/rabbitmq #日志文件目录挂载
    ports:
      - 5672:5672
      - 15672:15672
  elasticsearch:
    image: elasticsearch:7.17.3
    container_name: elasticsearch
    read_only: true #根文件系统只读，配置、插件、数据、日志与临时目录已单独挂载
    security_opt:
      - no-new-privileges:true #禁止容器内进程通过setuid/setgid程序提升权限（入口脚本降权不受影响）
    environment:
      - "cluster.name=elasticsearch" #设置集群名称为elasticsearch
      - "discovery.type=single-node" #以单一节点模式启动
      - "ES_JAVA_OPTS=-Xms512m -Xmx1024m" #设置es使用的jvm内存大小
    volumes:
      - /mydata/elasticsearch/config:/usr/share/elasticsearch/config #配置文件目录挂载，启动时需在此生成elasticsearch.keystore（先执行document/sh/init-env-config.sh，从镜像中导出elasticsearch.yml、jvm.options、log4j2.properties，镜像内置配置不会被屏蔽）
      - /mydata/elasticsearch/plugins:/usr/share/elasticsearch/plugins #插件文件目录挂载
      - /mydata/elasticsearch/data:/usr/share/elasticsearch/data #数据文件目录挂载
      - /mydata/elasticsearch/logs:/usr/share/elasticsearch/logs #日志文件目录挂载
      - /mydata/elasticsearch/tmp:/tmp #临时目录挂载，JNA需要可执行的临时目录，否则seccomp系统调用过滤器会被禁用
    ports:
      - 9200:9200
      - 9300:9300
  logstash:
    image: logstash:7.17.3
    container_name: logstash
    read_only: true #根文件系统只读，配置、数据、日志与临时目录已单独挂载
    security_opt:
      - no-new-privileges:true #禁止容器内进程通过setuid/setgid程序提升权限（入口脚本降权不受影响）
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - /mydata/logstash/config:/usr/share/logstash/config #配置文件目录挂载，入口脚本env2yaml会改写其中的logstash.yml（先执行document/sh/init-env-config.sh，从镜像中导出logstash.yml、pipelines.yml、jvm.options、log4j2.properties，镜像内置配置不会被屏蔽）
      - /mydata/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf #配置文件挂载
      - /mydata/logstash/data:/usr/share/logstash/data #数据文件目录挂载
      - /mydata/logstash/logs:/usr/share/logstash/logs #日志文件目录挂载
      - /mydata/logstash/tmp:/tmp #临时目录挂载，JRuby需要可执行的临时目录释放本地库
    depends_on:
      - elasticsearch #kibana在elasticsearch启动之后再启动
    links:
      - elasticsearch:es #可以用es这个域名访问elasticsearch服务
    ports:
      - 4560:4560
      - 4561:4561
      - 4562:4562
      - 4563:4563
  kibana:
    image: kibana:7.17.3
    container_name: kibana
    read_only: true #根文件系统只读，运行时数据使用tmpfs
    tmpfs:
      - /tmp #临时文件目录
      - /usr/share/kibana/data #uuid等运行时数据目录
    security_opt:
      - no-new-privileges:true #禁止容器内进程通过setuid/setgid程序提升权限（入口脚本降权不受影响）
    links:
      - elasticsearch:es #可以用es这个域名访问elasticsearch服务
    depends_on:
      - elasticsearch #kibana在elasticsearch启动之后再启动
    environment:
      - "elasticsearch.hosts=http://es:9200" #设置访问elasticsearch的地址
    ports:
      - 5601:5601
  mongo:
    image: mongo:4
    container_name: mongo
    read_only: true #根文件系统只读，数据目录已单独挂载
    tmpfs:
      - /tmp #mongod的unix socket及临时文件目录
    security_opt:
      - no-new-privileges:true #禁止容器内进程通过setuid/setgid程序提升权限（入口脚本降权不受影响）
    volumes:
      - /mydata/mongo/db:/data/db #数据文件目录挂载
    ports:
      - 27017:27017
  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001" #指定数据目录及console运行端口启动
    read_only: true #根文件系统只读，数据目录已单独挂载
    tmpfs:
      - /tmp #临时文件目录
      - /root/.minio #启动时创建的证书与本地配置目录
    security_opt:
      - no-new-privileges:true #禁止容器内进程通过setuid/setgid程序提升权限
    volumes:
      - /mydata/minio/data:/data #数据目录挂载
    environment:
      - "MINIO_ROOT_USER=minioadmin"
      - "MINIO_ROOT_PASSWORD=minioadmin"
    ports:
      - 9090:9000
      - 9001:9001
